<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EvoluaEla</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='black' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10' fill='%23E8B4BC'/><path d='M13 2L3 14h9l-1 8 10-12h-9l1-8z' fill='black'/></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Suppress benign WebSocket errors in the AI Studio environment
      window.addEventListener('unhandledrejection', (event) => {
        if (event.reason && (event.reason.message?.includes('WebSocket') || event.reason.includes?.('WebSocket'))) {
          event.preventDefault();
        }
      });
      // Also suppress console errors from Vite's HMR client
      const originalError = console.error;
      console.error = (...args) => {
        if (args[0] && typeof args[0] === 'string' && args[0].includes('[vite] failed to connect to websocket')) {
          return;
        }
        originalError.apply(console, args);
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
