<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EvoluaEla</title>
    <link rel="icon" type="image/png" href="/logo.png?v=3" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Suppress benign WebSocket errors in the AI Studio environment
      window.addEventListener('unhandledrejection', (event) => {
        if (event.reason && (event.reason.message?.includes('WebSocket') || event.reason.includes?.('WebSocket'))) {
          event.preventDefault();
        }
      });
      // Also suppress console errors from Vite's HMR client
      const originalError = console.error;
      console.error = (...args) => {
        if (args[0] && typeof args[0] === 'string' && args[0].includes('[vite] failed to connect to websocket')) {
          return;
        }
        originalError.apply(console, args);
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
