<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>EvoluaEla</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='black' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10' fill='%23E8B4BC'/><path d='M12 18.35l-0.725-0.66C8.7 15.36 7 13.82 7 11.93 7 10.39 8.21 9.18 9.75 9.18c0.87 0 1.705.405 2.25 1.045 0.545-0.64 1.38-1.045 2.25-1.045 1.54 0 2.75 1.21 2.75 2.75 0 1.89-1.7 3.43-3.625 4.76L12 18.35z' fill='black'/></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Suppress benign WebSocket errors in the AI Studio environment
      window.addEventListener('unhandledrejection', (event) => {
        if (event.reason && (event.reason.message?.includes('WebSocket') || event.reason.includes?.('WebSocket'))) {
          event.preventDefault();
        }
      });
      // Also suppress console errors from Vite's HMR client
      const originalError = console.error;
      console.error = (...args) => {
        if (args[0] && typeof args[0] === 'string' && args[0].includes('[vite] failed to connect to websocket')) {
          return;
        }
        originalError.apply(console, args);
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
